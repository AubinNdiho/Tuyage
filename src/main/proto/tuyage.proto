syntax = "proto3";

package tuyage;
option java_multiple_files = true;
option java_package = "com.tuyage.proto";
option java_outer_classname = "TuyageProto";

service TuyageService {
  rpc Register(RegisterRequest) returns (AuthResponse);
  rpc Login(LoginRequest) returns (AuthResponse);
  rpc RequestPasswordReset(PasswordResetRequest) returns (Ack);
  rpc ResetPassword(ResetPasswordRequest) returns (Ack);
  rpc Logout(AuthRequest) returns (Ack);
  rpc GetMe(AuthRequest) returns (User);
  rpc UpdateProfile(UpdateProfileRequest) returns (User);
  rpc ChangePassword(ChangePasswordRequest) returns (Ack);
  rpc DeleteAccount(DeleteAccountRequest) returns (Ack);
  rpc ListUsers(AuthRequest) returns (UsersResponse);
  rpc GetUnreadCounts(AuthRequest) returns (UnreadCountsResponse);

  rpc AddContact(ContactRequest) returns (User);
  rpc RemoveContact(ContactRequest) returns (Ack);
  rpc ListContacts(AuthRequest) returns (UsersResponse);
  rpc BlockUser(ContactRequest) returns (Ack);
  rpc UnblockUser(ContactRequest) returns (Ack);
  rpc ListBlocked(AuthRequest) returns (UsersResponse);

  rpc SendMessage(SendMessageRequest) returns (ChatMessage);
  rpc ListMessages(MessagesRequest) returns (MessagesResponse);
  rpc SearchMessages(SearchMessagesRequest) returns (MessagesResponse);
  rpc EditMessage(EditMessageRequest) returns (ChatMessage);
  rpc DeleteMessage(DeleteMessageRequest) returns (Ack);
  rpc PinMessage(PinMessageRequest) returns (Ack);
  rpc ReactMessage(ReactMessageRequest) returns (Ack);
  rpc MarkRead(MarkReadRequest) returns (Ack);
  rpc SetTyping(TypingRequest) returns (Ack);

  rpc CreateGroup(CreateGroupRequest) returns (Group);
  rpc UpdateGroup(UpdateGroupRequest) returns (Group);
  rpc ListGroups(AuthRequest) returns (GroupsResponse);
  rpc GetGroupMembers(GroupRequest) returns (UsersResponse);
  rpc GetGroupMembersDetailed(GroupRequest) returns (GroupMembersResponse);
  rpc AddGroupMember(GroupMemberRequest) returns (Ack);
  rpc RemoveGroupMember(GroupMemberRequest) returns (Ack);
  rpc SetGroupRole(GroupRoleRequest) returns (Ack);
  rpc LeaveGroup(GroupRequest) returns (Ack);
  rpc DeleteGroup(GroupRequest) returns (Ack);

  rpc CreateStatus(CreateStatusRequest) returns (StatusUpdate);
  rpc UpdateStatus(UpdateStatusRequest) returns (StatusUpdate);
  rpc DeleteStatus(StatusRequest) returns (Ack);
  rpc ListStatuses(AuthRequest) returns (StatusesResponse);
  rpc ViewStatus(StatusRequest) returns (Ack);
  rpc ListStatusViewers(StatusRequest) returns (UsersResponse);
  rpc CommentStatus(CommentStatusRequest) returns (StatusComment);
  rpc ListStatusComments(StatusRequest) returns (StatusCommentsResponse);

  rpc Subscribe(AuthRequest) returns (stream Event);
  rpc SignalCall(CallPacket) returns (Ack);
  rpc Call(stream CallPacket) returns (stream CallPacket);
}

message Empty {}
message Ack { bool ok = 1; string message = 2; }
message AuthRequest { string token = 1; }

message RegisterRequest {
  string username = 1;
  string display_name = 2;
  string password = 3;
}
message LoginRequest { string username = 1; string password = 2; }
message PasswordResetRequest { string phone = 1; }
message ResetPasswordRequest { string phone = 1; string code = 2; string new_password = 3; }
message AuthResponse { string token = 1; User user = 2; string message = 3; }

message User {
  int64 id = 1;
  string username = 2;
  string display_name = 3;
  string bio = 4;
  bytes avatar = 5;
  bool online = 6;
  int64 last_seen = 7;
}

message ContactRequest {
  string token = 1;
  int64 user_id = 2;
  string phone = 3;
}

message UpdateProfileRequest {
  string token = 1;
  string display_name = 2;
  string bio = 3;
  bytes avatar = 4;
  bool replace_avatar = 5;
}
message ChangePasswordRequest {
  string token = 1;
  string current_password = 2;
  string new_password = 3;
}
message DeleteAccountRequest {
  string token = 1;
  string password = 2;
}
message UsersResponse { repeated User users = 1; }
message UnreadCount { int64 user_id = 1; int64 group_id = 2; int32 count = 3; }
message UnreadCountsResponse { repeated UnreadCount counts = 1; }

enum MessageType {
  MESSAGE_TEXT = 0;
  MESSAGE_AUDIO = 1;
  MESSAGE_VIDEO = 2;
  MESSAGE_IMAGE = 3;
  MESSAGE_FILE = 4;
  MESSAGE_EMOJI = 5;
  MESSAGE_CALL_AUDIO = 6;
  MESSAGE_CALL_VIDEO = 7;
}

message SendMessageRequest {
  string token = 1;
  int64 recipient_user_id = 2;
  int64 group_id = 3;
  MessageType type = 4;
  string content = 5;
  string file_name = 6;
  string mime_type = 7;
  bytes data = 8;
  int64 reply_to_id = 9;
}

message ChatMessage {
  int64 id = 1;
  int64 sender_id = 2;
  string sender_name = 3;
  int64 recipient_user_id = 4;
  int64 group_id = 5;
  MessageType type = 6;
  string content = 7;
  string file_name = 8;
  string mime_type = 9;
  bytes data = 10;
  int64 reply_to_id = 11;
  int64 created_at = 12;
  bool edited = 13;
  bool deleted = 14;
  bool read = 15;
  string reactions_summary = 16;
  string call_id = 17;
  string call_status = 18;
  int64 call_duration_seconds = 19;
  bool delivered = 20;
  bool pinned = 21;
}

message MessagesRequest {
  string token = 1;
  int64 other_user_id = 2;
  int64 group_id = 3;
  int32 limit = 4;
}
message SearchMessagesRequest {
  string token = 1;
  int64 other_user_id = 2;
  int64 group_id = 3;
  string query = 4;
  int32 limit = 5;
}
message MessagesResponse { repeated ChatMessage messages = 1; }
message EditMessageRequest { string token = 1; int64 message_id = 2; string content = 3; }
message DeleteMessageRequest { string token = 1; int64 message_id = 2; bool for_everyone = 3; }
message PinMessageRequest { string token = 1; int64 message_id = 2; bool pinned = 3; }
message ReactMessageRequest { string token = 1; int64 message_id = 2; string emoji = 3; }
message MarkReadRequest { string token = 1; int64 message_id = 2; }
message TypingRequest {
  string token = 1;
  int64 recipient_user_id = 2;
  int64 group_id = 3;
  bool typing = 4;
  string activity = 5;
}

message CreateGroupRequest {
  string token = 1;
  string name = 2;
  string description = 3;
  bytes avatar = 4;
  repeated int64 member_ids = 5;
}
message UpdateGroupRequest {
  string token = 1;
  int64 group_id = 2;
  string name = 3;
  string description = 4;
  bytes avatar = 5;
  bool replace_avatar = 6;
}
message Group {
  int64 id = 1;
  string name = 2;
  string description = 3;
  bytes avatar = 4;
  int64 owner_id = 5;
  int64 created_at = 6;
  int32 member_count = 7;
  string current_user_role = 8;
}
message GroupsResponse { repeated Group groups = 1; }
message GroupRequest { string token = 1; int64 group_id = 2; }
message GroupMemberRequest { string token = 1; int64 group_id = 2; int64 user_id = 3; }
message GroupRoleRequest { string token = 1; int64 group_id = 2; int64 user_id = 3; string role = 4; }
message GroupMember { User user = 1; string role = 2; }
message GroupMembersResponse { repeated GroupMember members = 1; }

enum StatusType {
  STATUS_TEXT = 0;
  STATUS_IMAGE = 1;
  STATUS_VIDEO = 2;
}
message CreateStatusRequest {
  string token = 1;
  StatusType type = 2;
  string content = 3;
  string background = 4;
  string file_name = 5;
  string mime_type = 6;
  bytes data = 7;
}
message UpdateStatusRequest {
  string token = 1;
  int64 status_id = 2;
  string content = 3;
  string background = 4;
}
message StatusUpdate {
  int64 id = 1;
  int64 user_id = 2;
  string user_name = 3;
  StatusType type = 4;
  string content = 5;
  string background = 6;
  string file_name = 7;
  string mime_type = 8;
  bytes data = 9;
  int64 created_at = 10;
  int64 expires_at = 11;
  int32 comment_count = 12;
  int32 view_count = 13;
  bool viewed_by_me = 14;
}
message StatusesResponse { repeated StatusUpdate statuses = 1; }
message CommentStatusRequest { string token = 1; int64 status_id = 2; string comment = 3; }
message StatusComment {
  int64 id = 1;
  int64 status_id = 2;
  int64 user_id = 3;
  string user_name = 4;
  string comment = 5;
  int64 created_at = 6;
}
message StatusRequest { string token = 1; int64 status_id = 2; }
message StatusCommentsResponse { repeated StatusComment comments = 1; }

enum EventType {
  EVENT_MESSAGE = 0;
  EVENT_PRESENCE = 1;
  EVENT_STATUS = 2;
  EVENT_TYPING = 3;
  EVENT_GROUP = 4;
  EVENT_READ = 5;
  EVENT_REACTION = 6;
  EVENT_CALL = 7;
  EVENT_CONTACT = 8;
  EVENT_BLOCK = 9;
}
message Event {
  EventType type = 1;
  ChatMessage message = 2;
  User user = 3;
  Group group = 4;
  StatusUpdate status = 5;
  int64 actor_id = 6;
  string actor_name = 7;
  int64 target_user_id = 8;
  int64 group_id = 9;
  bool typing = 10;
  string text = 11;
  CallPacket call = 12;
}

enum CallPacketType {
  CALL_REGISTER = 0;
  CALL_OFFER = 1;
  CALL_ACCEPT = 2;
  CALL_REJECT = 3;
  CALL_END = 4;
  CALL_AUDIO = 5;
  CALL_VIDEO = 6;
  CALL_UNAVAILABLE = 7;
  CALL_LEAVE = 8;
}

message CallPacket {
  string token = 1;
  string call_id = 2;
  int64 from_user_id = 3;
  int64 to_user_id = 4;
  CallPacketType type = 5;
  bytes payload = 6;
  int64 timestamp = 7;
  bool video_enabled = 8;
  string text = 9;
  int64 sequence = 10;
  int64 media_timestamp = 11;
  int64 group_id = 12;

  // Format PCM reel du microphone emetteur. Cela evite de supposer que
  // toutes les cartes son Windows acceptent exactement 44,1 kHz.
  int32 audio_sample_rate = 13;
  int32 audio_sample_bits = 14;
  int32 audio_channels = 15;
  // "opus" pour les nouveaux appels; vide = PCM historique.
  string audio_codec = 16;
}
